<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Family Tree</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Az én családfám</h1>
      <p class="subtitle">Válaszd ki, hogy melyik családtag típust szeretnéd látni.</p>

      <label for="family-role" class="label">Családtag típusa:</label>
      <select id="family-role" aria-label="Családtag típus kiválasztása">
        <option value="all">Összes</option>
        <option value="nagyszülő">Nagyszülő</option>
        <option value="szülő">Szülő</option>
        <option value="gyermek">Gyermek</option>
        <option value="testvér">Testvér</option>
      </select>

      <section id="family-list" class="family-list" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
